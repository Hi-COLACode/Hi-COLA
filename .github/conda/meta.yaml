{% set version = environ['HICOLA_VERSION'] %}

package:
  name: hi-cola
  version: {{ version }}

source:
  url: {{ environ['HICOLA_SDIST_URL'] }}
  sha256: {{ environ['HICOLA_SDIST_SHA256'] }}

build:
  number: 0

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake >=3.18
    - ninja
    - pkg-config
  host:
    - python >=3.10,<3.13
    - pip
    - setuptools >=77
    - setuptools-scm >=8
    - fftw
    - gsl
    - lua
    - healpix_cxx
    - llvm-openmp  # [osx]
  run:
    - python >=3.10,<3.13
    - numpy >=1.26
    - scipy >=1.11
    - sympy >=1.12
    - matplotlib-base >=3.8
    - configobj >=5.0
    - pandas >=2.0
    - fftw
    - gsl
    - lua
    - healpix_cxx

test:
  imports:
    - HiCOLA
    - HiCOLA.backend
    - HiCOLA.Frontend.expression_builder
  requires:
    - pip
  commands:
    - python -m pip check

about:
  home: https://github.com/Hi-COLACode/Hi-COLA
  license: GPL-3.0-only
  license_file: LICENSE
  summary: Hi-COLA frontend with the compiled COLASolver simulation backend
