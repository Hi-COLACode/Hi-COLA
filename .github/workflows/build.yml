# Experimental (test-only) release-artifact workflow.
# Builds a pure-Python wheel + sdist, rebuilds the same-named wheel from the
# sdist (with build isolation), validates both wheels, and runs an independent
# installed smoke test against both artifact variants on 3 OS / 4 Python
# versions. The compatible dependencies support the smoke check.
#
# Default-branch pushes publish Python artifacts to TestPyPI and native conda
# packages to the configured Anaconda.org account's test label.
# Production PyPI publication is present but FULLY COMMENTED OUT and must
# stay disabled until production publishing is explicitly configured.

name: Build and verify Python distributions

on:
  pull_request:
  push:
    branches: ['**']
    tags:
      - "v*"
  workflow_dispatch:

# Read-only at the top level: only the publishing jobs grant scoped
# id-token write permissions, and they are conditional. Pull requests and
# tag pushes have no active publication job.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build wheel and source archive
    if: >-
      github.event_name != 'push' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip build twine

      - name: Set development version for TestPyPI
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          BUILD_RUN_NUMBER: ${{ github.run_number }}
        # Setuptools preserves this numeric suffix in the sdist so rebuilt
        # wheels carry the same version. Workflow reruns reuse the suffix.
        run: |
          python - <<'PY'
          import configparser
          import os
          from pathlib import Path

          run_number = os.environ['BUILD_RUN_NUMBER']
          if not (run_number.isascii() and run_number.isdecimal() and int(run_number) > 0):
              raise ValueError('BUILD_RUN_NUMBER must be a positive integer')
          config_path = Path('setup.cfg')
          config = configparser.RawConfigParser()
          config.read(config_path)
          if not config.has_section('egg_info'):
              config.add_section('egg_info')
          suffix = f'.dev{int(run_number)}'
          config.set('egg_info', 'tag_build', suffix)
          config.set('egg_info', 'tag_date', '0')
          with config_path.open('w', encoding='utf-8') as stream:
              config.write(stream)
          print(f'Development version suffix: {suffix}')
          PY

      - name: Build wheel and sdist
        run: |
          python -m build

      - name: Check artifact metadata
        run: |
          twine check dist/*.whl dist/*.tar.gz

      - name: Rebuild wheel from sdist in a temporary source directory
        # Uses build isolation so the build dependencies declared in
        # pyproject.toml are installed by pip wheel. The rebuilt wheel keeps
        # the same filename as the original and is stored in a separate
        # directory so the original wheel in dist/ is never overwritten.
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          SDIST="$(ls dist/*.tar.gz)"
          tar -xzf "$SDIST" -C "$TMP"
          SRC="$(find "$TMP" -mindepth 1 -maxdepth 1 -type d)"
          mkdir -p dist-sdist
          python -m pip wheel --no-deps --no-cache-dir -w dist-sdist "$SRC"
          echo "rebuilt sdist-derived wheel: $(ls dist-sdist/*.whl)"

      - name: Validate both wheels are pure python and compiled-binary free
        # Single validation pass, after the rebuild, over the original wheel
        # (dist/) and the sdist-rebuilt wheel (dist-sdist/): the WHEEL
        # metadata must be Root-Is-Purelib true with Tag py3-none-any, the
        # filename must use the -py3-none-any.whl delimiter, and no
        # compiled/native files (including versioned .so.N) may appear.
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, pathlib, zipfile

          NATIVE_SUFFIXES = (".so", ".pyd", ".dll", ".dylib", ".exe", ".a", ".lib", ".o")

          def check(name: str, whl: pathlib.Path) -> None:
              print(f"[check] {name}: {whl.name}")
              # Filename must use the -py3-none-any.whl delimiter, e.g.
              # Hi_COLA-1.0.0-py3-none-any.whl.
              assert name.endswith("-py3-none-any.whl"), \
                  f"unexpected wheel filename: {name}"
              zf = zipfile.ZipFile(whl)
              names = zf.namelist()
              wheel_meta = [n for n in names if n.endswith("WHEEL")]
              assert len(wheel_meta) == 1, "missing WHEEL metadata"
              meta = {
                  line.split(":", 1)[0].strip(): line.split(":", 1)[1].strip()
                  for line in zf.read(wheel_meta[0]).decode("utf-8").splitlines()
                  if ":" in line
              }
              assert meta.get("Root-Is-Purelib") == "true", \
                  f"wheel is not purelib: {meta.get('Root-Is-Purelib')}"
              assert meta.get("Tag") == "py3-none-any", \
                  f"wheel tag is not py3-none-any: {meta.get('Tag')}"
              for n in names:
                  lc = n.lower()
                  for suffix in NATIVE_SUFFIXES:
                      assert not lc.endswith(suffix), \
                          f"compiled/native artifact found in {name}: {n}"
                  # Versioned shared objects, e.g. libfoo.so.1 or libfoo.so.1.2
                  # (a plain ".so" file is already rejected above).
                  if ".so." in lc:
                      raise AssertionError(
                          f"versioned shared object found in {name}: {n}")
              print(f"[check] {name}: OK ({len(names)} files)")

          original = sorted(glob.glob("dist/*.whl"))
          rebuilt = sorted(glob.glob("dist-sdist/*.whl"))
          assert len(original) == 1, \
              f"expected exactly one original wheel, got: {original}"
          assert len(rebuilt) == 1, \
              f"expected exactly one sdist-rebuilt wheel, got: {rebuilt}"
          # The rebuilt wheel must have the SAME filename as the original.
          assert pathlib.Path(original[0]).name == pathlib.Path(rebuilt[0]).name, \
              f"filenames differ: {original[0]} vs {rebuilt[0]}"
          check(pathlib.Path(original[0]).name, pathlib.Path(original[0]))
          check(pathlib.Path(rebuilt[0]).name, pathlib.Path(rebuilt[0]))
          print("wheel validation OK: both wheels are pure python, "
                "same filename, no compiled binaries")
          PY

      - name: Upload original artifacts (original wheel + sdist)
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-original
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

      - name: Upload sdist-rebuilt wheel artifact
        # Contains exactly one wheel: the wheel rebuilt from the sdist with
        # the same filename as the original.
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-sdist
          path: |
            dist-sdist/*.whl
          if-no-files-found: error

  test-matrix:
    name: Verify wheel and source archive / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: build
    # Python 3.9 requires the Ubuntu 24.04 setup-python distribution.
    runs-on: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.9' && 'ubuntu-24.04' || matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      # No checkout: artifacts only, so the installed package cannot be
      # shadowed by a source tree.
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download built wheel
        uses: actions/download-artifact@v4
        with:
          name: artifacts-original
          path: ci-artifacts/original

      - name: Download wheel rebuilt from source archive
        uses: actions/download-artifact@v4
        with:
          name: artifacts-sdist
          path: ci-artifacts/sdist

      - name: Install compatible runtime dependencies
        run: |
          python -m pip install --quiet --no-cache-dir \
            "numpy>=1.23.5,<2" \
            "scipy>=1.9.3,<2" \
            "sympy>=1.12,<2" \
            "matplotlib>=3.7,<4" \
            "configobj>=5,<6"

      - name: Verify both wheels with the installed frontend calculation
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ""
          MPLBACKEND: Agg
          ARTIFACT_DIRECTORY: ${{ github.workspace }}/ci-artifacts
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          import textwrap

          # Each calculation runs in a fresh interpreter to use the wheel
          # just installed, rather than modules cached from the first check.
          calculation = textwrap.dedent('''\
          import os, pathlib, sys
          assert os.environ.get("MPLBACKEND") == "Agg"
          from HiCOLA.Frontend import expression_builder as eb
          # Imported module must resolve beneath the active sys.prefix,
          # i.e. it is the installed package, not a stray source copy.
          prefix = pathlib.Path(sys.prefix).resolve()
          pathlib.Path(eb.__file__).resolve().relative_to(prefix)
          # Frontend symbolic calculation exercise:
          # d/dX (X^3 * phi^2) == 3 X^2 phi^2
          import sympy as sym
          expr = eb.K_func(eb.X**3 * eb.phi**2, "X")
          assert sym.expand(expr - 3*eb.X**2*eb.phi**2) == 0, \
              "unexpected derivative: " + str(expr)
          print("smoke OK:", eb.__file__)
          ''')

          artifact_directory = Path(os.environ['ARTIFACT_DIRECTORY']).resolve()
          for variant, description in (
              ('original', 'built wheel'),
              ('sdist', 'wheel rebuilt from source archive'),
          ):
              wheels = list((artifact_directory / variant).glob('*.whl'))
              if len(wheels) != 1:
                  raise RuntimeError(f'Expected one {description}, found {wheels}')
              print(f'::group::Verify {description}', flush=True)
              try:
                  # Replace the installed distribution even when both wheels
                  # have the same version and filename.
                  subprocess.run([
                      sys.executable, '-m', 'pip', 'install', '--no-deps',
                      '--force-reinstall', str(wheels[0]),
                  ], check=True)
                  subprocess.run([sys.executable, '-c', calculation], check=True)
              finally:
                  print('::endgroup::', flush=True)
          PY

  # Test PyPI (test-only) publication.
  # - Runs only on push to the repository's current default branch, never on
  #   pull requests, tags, or manual dispatch.
  # - Requires BOTH build and test-matrix to succeed.
  # - Uses Trusted Publishing (OIDC id-token; no password secrets).
  # - Uploads ONLY the original artifacts (original wheel + sdist), not the
  #   sdist-rebuilt wheel.
  # - Reruns reuse the same development version and skip existing uploads.
  publish-testpypi:
    name: Publish to Test PyPI
    needs: [build, test-matrix]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      # No checkout: only the original build artifacts are uploaded.
      - name: Download original artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts-original
          path: dist

      - name: Publish original artifacts to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # PRODUCTION PYPI PUBLICATION — INTENTIONALLY DISABLED.
  # Enable this job ONLY when production publishing (Trusted Publishing on
  # pypi.org, version policy, and the pypi GitHub environment) is fully
  # configured. Until then this job MUST remain entirely commented out so
  # that no production publication can ever be triggered.
  #
  # publish-pypi:
  #   name: Publish to PyPI
  #   needs: [build, test-matrix]
  #   if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 10
  #   environment:
  #     name: pypi
  #   permissions:
  #     contents: read
  #     id-token: write
  #   steps:
  #     - name: Download original artifacts
  #       uses: actions/download-artifact@v4
  #       with:
  #         name: artifacts-original
  #         path: dist
  #     - name: Publish original artifacts to PyPI (production)
  #       uses: pypa/gh-action-pypi-publish@release/v1

  # Configure repository variable ANACONDA_OWNER and environment conda-test's
  # ANACONDA_API_TOKEN secret. Without an owner, this job remains disabled.
  publish-conda-test:
    name: Build and publish native conda test package / ${{ matrix.os }}
    needs: [build, test-matrix]
    if: >-
      github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      vars.ANACONDA_OWNER != ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    environment: conda-test
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash -el {0}
    env:
      MPLBACKEND: Agg
      CMAKE_GENERATOR: Ninja
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download tested Python distributions
        uses: actions/download-artifact@v4
        with:
          name: artifacts-original
          path: dist
      - name: Set up conda build environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: conda-build
          python-version: '3.11'
          channels: conda-forge
          channel-priority: strict
      - name: Install conda build tools
        run: |
          conda install --override-channels -c conda-forge -y conda-build anaconda-client
      - name: Use the tested source archive and version
        run: |
          python - <<'PY'
          from email.parser import Parser
          import hashlib
          import os
          from pathlib import Path
          import zipfile
          from packaging.version import Version

          wheels = list(Path('dist').glob('*.whl'))
          archives = list(Path('dist').glob('*.tar.gz'))
          if len(wheels) != 1 or len(archives) != 1:
              raise RuntimeError('Expected exactly one tested wheel and source archive')
          with zipfile.ZipFile(wheels[0]) as wheel:
              metadata = [name for name in wheel.namelist() if name.endswith('.dist-info/METADATA')]
              if len(metadata) != 1:
                  raise RuntimeError('Expected exactly one distribution metadata file')
              version = str(Version(Parser().parsestr(wheel.read(metadata[0]).decode())['Version']))
          archive = archives[0].resolve()
          settings = {
              'HICOLA_VERSION': version,
              'HICOLA_SDIST_URL': archive.as_uri(),
              'HICOLA_SDIST_SHA256': hashlib.sha256(archive.read_bytes()).hexdigest(),
          }
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              for key, value in settings.items():
                  stream.write(f'{key}={value}\n')
          PY
      - name: Build native conda package and run installed simulation
        run: |
          conda build .github/conda --override-channels -c conda-forge --no-anaconda-upload --output-folder conda-dist
      - name: Retain tested native conda package
        uses: actions/upload-artifact@v4
        with:
          name: conda-test-${{ matrix.os }}
          path: |
            conda-dist/**/*.conda
            conda-dist/**/*.tar.bz2
          if-no-files-found: error
      - name: Upload native package to Anaconda.org test label
        env:
          ANACONDA_CLIENT_FORCE_STANDALONE: '1'
          BINSTAR_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
          ANACONDA_OWNER: ${{ vars.ANACONDA_OWNER }}
        run: |
          set -euo pipefail
          if [ -z "$BINSTAR_API_TOKEN" ]; then
            echo 'Set the ANACONDA_API_TOKEN secret in the conda-test environment.'
            exit 1
          fi
          shopt -s nullglob
          packages=(conda-dist/*/*.conda conda-dist/*/*.tar.bz2)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo 'Expected exactly one tested native conda package.'
            exit 1
          fi
          anaconda upload --user "$ANACONDA_OWNER" --label test --skip-existing "${packages[0]}"
