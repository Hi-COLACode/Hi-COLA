name: Links

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  local-links:
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      DOCS_VERSION: latest
      DOCS_SOURCE_REF: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: |
            requirements-docs.lock
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.lock
      - name: Build documentation for link tests
        run: python -m sphinx -W --keep-going -b html Documentation Documentation/_build/html
      - name: Check local links and anchors with Lychee
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          args: >-
            --offline --include-fragments --no-progress --no-ignore
            --exclude-path '(^|/)_static/' --
            './Documentation/_build/html/**/*.html'
          fail: true
          failIfEmpty: true
          output: lychee/local-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-link-report
          path: lychee/local-report.md
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-html
          path: Documentation/_build/html
          if-no-files-found: error

  external-links:
    needs: local-links
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: documentation-html
          path: checked-documentation
      - name: Check external links with Lychee
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          args: >-
            --verbose --no-progress
            --scheme http --scheme https
            --timeout 20 --max-retries 2 --max-concurrency 5
            --include-verbatim
            './checked-documentation/**/*.html'
            './README.md' './Documentation/**/*.md'
            './HiCOLA/**/*.md' './HiCOLA/**/README'
            './HiCOLA/**/*.py' './HiCOLA/**/*.cpp'
            './HiCOLA/**/*.h' './HiCOLA/**/*.hpp'
            './HiCOLA/**/*.lua' './HiCOLA/**/*.ini'
            './setup.py'
          fail: false
          failIfEmpty: true
          jobSummary: true
          format: markdown
          output: lychee/report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-link-report
          path: lychee/report.md
          if-no-files-found: warn
