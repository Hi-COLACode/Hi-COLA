name: Command line tests

on:
  push:
    branches: [Hi-COLA_public]
  pull_request:

permissions:
  contents: read

jobs:
  command-line:
    name: Command line tools (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Hi-COLA
        run: python -m pip install -e .
      - name: Run command line tests
        run: python -m unittest discover -s tests/command_line -v
