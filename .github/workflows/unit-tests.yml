name: Unit tests

on:
  push:
    branches: [Hi-COLA_public]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
      CODECOV_TOKEN_AVAILABLE: ${{ secrets.CODECOV_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: python -m pip install -e '.[tests]'
      - name: Run unit tests with coverage
        run: python -m coverage run -m unittest discover -s tests -v
      - name: Generate coverage reports
        if: always()
        run: |
          python -m coverage report
          python -m coverage xml
          python -m coverage html
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14
          if-no-files-found: error
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN_AVAILABLE == 'true' && hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: true
