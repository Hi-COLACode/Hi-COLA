[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "Hi_COLA"
version = "0.0.0"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "sympy>=1.12",
    "matplotlib>=3.8",
    "configobj>=5.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
tests = [
    "coverage>=7.6",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["HiCOLA", "HiCOLA.*"]
namespaces = false
