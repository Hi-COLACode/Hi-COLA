[build-system]
requires = ["setuptools>=77", "wheel", "scikit-build>=0.18,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "hicola-frontend"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dynamic = ["version"]
requires-python = ">=3.9,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "sympy>=1.12",
    "matplotlib>=3.8",
    "configobj>=5.0",
    "pandas>=2.0",
]

[project.scripts]
hicola_plot_pofk = "HiCOLA.Plotting.pofk:main"
hicola_plot_background = "HiCOLA.Plotting.background:main"
hicola_plot_growth = "HiCOLA.Plotting.growth:main"
hicola_plot_frontend = "HiCOLA.Plotting.frontend:main"

[project.optional-dependencies]
tests = [
    "coverage>=7.6",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["HiCOLA", "HiCOLA.*"]
namespaces = false

[tool.setuptools.package-data]
# bin/* matches the solver only in native builds, which install it there.
HiCOLA = ["bin/*", "Parameter_files/**/*.ini", "Parameter_files/**/*.lua", "Parameter_files/**/*.txt", "Parameter_files/**/*.dat"]
